<style>
  :root { color-scheme: light; }
  html, body { background: #FFFFFF; color: #3A2A2A; }
  body { font-family: "Pretendard GOV", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .tabnum { font-variant-numeric: tabular-nums; }
  /* [애니메이션] */
  .press { transition: transform .12s ease, box-shadow .12s ease, background-color .2s ease; }
  .press:active { transform: scale(.95); }
  @keyframes pop { 0% { transform: scale(.9); } 55% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .pop { animation: pop .45s ease-out; }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  .shake { animation: shake .4s ease; }
  @keyframes floatUp { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-120px) scale(1); opacity: 0; } }
  .confetti { position: fixed; bottom: 30%; pointer-events: none; font-size: 22px; animation: floatUp 1.4s ease-out forwards; z-index: 60; }
  @keyframes beat { 0% { transform: scale(1); } 30% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .beat { animation: beat .25s ease-out; }
  .note-now { outline: 4px solid #3A2A2A; outline-offset: 2px; transform: translateY(-3px); }
  @media (prefers-reduced-motion: reduce) { .pop, .shake, .confetti, .beat { animation: none !important; } }
  .num-input { font-variant-numeric: tabular-nums; }
  .num-input:focus { outline: none; box-shadow: 0 0 0 3px #FFC9BD; border-color: #D4584B; }
  button:focus-visible, input:focus-visible { outline: 3px solid #F2A08F; outline-offset: 2px; }
  button:disabled { cursor: not-allowed; }
</style>

<div class="min-h-screen flex flex-col">
  <!-- ===================== 머리말 ===================== -->
  <header class="px-4 pt-5 pb-3">
    <div class="max-w-5xl mx-auto flex flex-wrap items-end justify-between gap-3">
      <div>
        <p class="text-sm font-semibold text-violet-deep">5학년 수학 · 소수의 곱셈 × 음악 · 소리의 어울림</p>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">화음 메이커 <span id="actBadge"></span></h1>
      </div>
      <div class="flex gap-2">
        <button id="homeBtn" class="press px-4 py-2 rounded-2xl bg-white border border-line text-sm font-bold shadow-soft">🏠 처음 화면</button>
      </div>
    </div>
  </header>

  <!-- ===================== 단계 메뉴 (활동 안에서만 보여요) ===================== -->
  <nav id="navWrap" class="sticky top-0 z-40 bg-white/90 backdrop-blur px-4 py-2 border-b border-line hidden" aria-label="활동 단계">
    <div id="stepNav" class="max-w-5xl mx-auto grid gap-1.5 sm:gap-2"></div>
  </nav>

  <main class="flex-1 px-4 py-5"><div class="max-w-5xl mx-auto" id="screen"></div></main>

  <!-- ===================== 꼬리말 ===================== -->
  <footer class="px-4 py-6 border-t border-line bg-white/60">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3 text-sm text-muted">
      <span class="font-semibold">Created by. 투돌샘</span>
      <!-- 선생님 도구: 주소 끝에 #teacher 를 붙였을 때만 보여요 -->
      <div id="teacherTools" class="hidden flex flex-wrap gap-2">
        <button id="tFill" class="press px-3 py-1.5 rounded-xl bg-white border border-line">선생님: 이 활동 정답 채우기</button>
        <button id="tUnlock" class="press px-3 py-1.5 rounded-xl bg-white border border-line">선생님: 모든 단계 열기</button>
        <button id="tReset" class="press px-3 py-1.5 rounded-xl bg-white border border-line text-rose-deep">선생님: 모두 처음으로</button>
      </div>
    </div>
  </footer>
</div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-50 hidden px-5 py-3 rounded-2xl bg-ink text-white text-sm font-semibold shadow-soft" role="status" aria-live="polite"></div>

function scoreView(view) {
  const sg = SG(); let idx = 0;
  const lines = [];
  for (let i = 0; i < sg.bars.length; i += sg.lineBars) lines.push(sg.bars.slice(i, i + sg.lineBars).map((bar, j) => ({ bar, no: i + j + 1 })));
  return `<div class="space-y-3">${lines.map(line => `<div class="scoreline">${line.map(({ bar, no }) => {
    const ch = sg.inChorus(no);
    return `<div class="sbar ${ch ? 'chorus' : ''}">${ch && (no === sg.chorus[0] || (no - 1) % sg.lineBars === 0) ? '<span class="chtag">🎵 화음</span>' : ''}<div class="snotes">${bar.map(([k, b]) => {
      const i = idx++, w = b >= 2 ? 72 : b >= 1 ? 56 : b >= 0.5 ? 44 : 38;
      if (k === 'rest') return `<div data-col="${i}" class="stile" style="width:${w}px;background:${NOTES.rest.bg};color:${NOTES.rest.ink}">쉼</div>`;
      let key = k, label;
      const two = s => s.replace('높은 ', '높은<br>').replace('낮은 ', '낮은<br>');
      if (view === 'both') {   // 위: 멜로디, 아래: 아래 화음 (실로폰 친구 4명이 한 악보를 함께 봐요)

        return `<div data-col="${i}" class="stile dual" style="width:${w}px"><span style="background:${m.bg};color:${m.ink}">${two(m.name)}</span><span style="background:${hb};color:${hi}">${two(hl)}</span></div>`;
      }
      if (view === 'melody') label = NOTES[k].name;

      const n = key ? NOTES[key] : { bg: '#FFFFFF', ink: '#A89C98' };
      return `<div data-col="${i}" class="stile" style="width:${w}px;background:${n.bg};color:${n.ink}">${label.replace('높은 ', '높은<br>').replace('낮은 ', '낮은<br>')}</div>`;
    }).join('')}</div></div>`;
  }).join('')}</div>`).join('')}</div>`;
}

        <div class="flex flex-wrap items-center gap-2"><span class="text-sm text-muted">악보 보기</span>${['both', 'melody', 'down'].map(p => `<button data-a="pview" data-v="${p}" class="press px-3 py-1.5 rounded-xl text-sm font-bold ${PARTS[p].soft} ${PARTS[p].deep} ${pv === p ? 'border-[3px] ' + PARTS[p].border : 'border-2 border-transparent opacity-80'}">${PARTS[p].name}</button>`).join('')}</div></div>
      ${scoreView(pv)}</div>
    <div class="flex flex-wrap justify-between gap-2">${btn(SECOND, 'data-a="step" data-v="1"', '← 화음 계산하기')}${btn(SECOND, 'data-a="songs"', '다른 노래 보기')}</div>
    <div style="height:84px" aria-hidden="true"></div>
    <div class="cbar" role="group" aria-label="연주 버튼">
      ${running ? `<button data-a="cpause" class="press cbtn" style="background:#C2415B;color:#fff">⏸ 멈추기</button>`
        : `<button data-a="cplay" data-v="0" class="press cbtn bg-violet text-white">🥁 처음부터</button>${concertPos > 0 ? `<button data-a="cplay" data-v="resume" class="press cbtn bg-white text-violet-deep" style="border:2px solid currentColor">⏯ 이어 듣기</button>` : ''}`}
    </div>
  </section>`;
}

/* ============================================================
   [15] 연주 (악보 깜빡임은 소리 시계에 맞춰요)
   ============================================================ */
let running = null, concertPos = 0, vis = null;
// 학생이 화면을 직접 움직이면 4초 동안은 자동으로 따라가지 않아요
let lastUserScroll = 0;
['wheel', 'touchstart', 'touchmove', 'keydown'].forEach(ev => window.addEventListener(ev, () => { lastUserScroll = Date.now(); }, { passive: true }));
function highlight(i) {
  let el = null;
  document.querySelectorAll('[data-col]').forEach(x => { const c = +x.dataset.col, on = c === i; x.classList.toggle('note-now', on); x.classList.toggle('played', running === 'concert' && c < i); if (on) el = x; });
  document.querySelectorAll('.sbar').forEach(x => x.classList.toggle('bar-now', !!el && x.contains(el)));
  if (!el || running !== 'concert' || Date.now() - lastUserScroll < 4000) return;
  const r = el.getBoundingClientRect(), bottomSafe = window.innerHeight - 110;   // 아래 연주 버튼에 가리지 않게
  if (r.top < 70 || r.bottom > bottomSafe) window.scrollBy({ top: r.top - window.innerHeight * 0.4, behavior: 'smooth' });
}
function visualRun(base, events, endAt, onEnd) {
  const c = audio(); if (!c) return;
  const run = { k: 0, ev: events.map(e => ({ at: base + e.t, fn: e.fn })).sort((x, y) => x.at - y.at), end: base + endAt, onEnd };
  vis = run;
  const tick = () => {
    if (vis !== run) return;
    const now = c.currentTime - (c.outputLatency || 0) - (c.baseLatency || 0);
    while (run.k < run.ev.length && run.ev[run.k].at <= now) run.ev[run.k++].fn();
    if (now >= run.end) { vis = null; run.onEnd && run.onEnd(); return; }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function stopAll() {
  vis = null; stopSound();
  document.querySelectorAll('[data-col]').forEach(el => el.classList.remove('note-now', 'played'));
  document.querySelectorAll('.sbar').forEach(el => el.classList.remove('bar-now'));
  if (running) { running = null; render(); }
}
// 노래 연주: 준비 박자 → 박자(드럼) + 고른 소리. from = 몇 번째 음부터
function playSong(sid, opts, from = 0, onDone) {
  const sg = SONGS[sid], c = audio(); if (!c) return;
  const b = 60 / sg.bpm / (opts.slow ? 0.75 : 1), per = sg.per, base = c.currentTime + 0.02, ev = [];
  let t = 0.2;
  if (opts.count) {
    const n = per === 2 ? 4 : per, counter = () => document.getElementById('countNum');
    for (let i = 0; i < n; i++) { click(t + i * b, i % per === 0); ev.push({ t: t + i * b, fn: () => { const el = counter(); if (el) { el.textContent = String(n - i); el.classList.remove('beat'); void el.offsetWidth; el.classList.add('beat'); } } }); }
    t += n * b; ev.push({ t: t - 0.001, fn: () => { const el = counter(); if (el) el.textContent = '♪'; } });
  }
  const start = t;
  // 어느 박자부터 시작하는지 (이어 듣기)
  let beatAt = 0; sg.flat.forEach((x, i) => { if (i < from) beatAt += x.b; });
  const totalBeats = sg.beats - beatAt, any = ['up', 'down', 'melody'].some(p => opts[p]);
  const dv = any ? 0.3 : 0.8;   // 화음이 잘 들리도록 박자는 작게
  if (opts.drums) for (let j = 0; j < Math.round(totalBeats * 2); j++) {
    const tt = start + j * b / 2, gb = beatAt + j / 2;   // gb: 노래 전체에서 몇 번째 박자인지
    if (!opts.bells) hat(tt, dv * 0.8);
    if (j % 2 === 0) { if (Math.round(gb) % per === 0) kick(tt, dv); else snare(tt, dv * 0.8); }
  }
  if (opts.bells) for (let j = 0; j < Math.round(totalBeats); j++) { const tt = start + j * b, gb = Math.round(beatAt + j); bell(tt, (any ? 0.55 : 0.85) * (gb % per === 0 ? 1 : 0.7)); }   // 한 박에 한 번 '찰랑'
  let tt = start;
  const hv = opts.melody ? 0.26 : 0.5;   // 멜로디가 켜져 있으면 멜로디가 묻히지 않도록 화음을 줄여요
  const oct = Math.pow(2, opts.oct || 0);   // 실로폰 높이에 맞춰 옥타브를 올려요
  sg.flat.forEach((x, i) => {
    if (i < from) return;
    const d = x.b * b;
    if (opts.melody) toneMR(NOTES[x.k].et * oct, tt, d, 0.42);
    if (x.k !== 'rest' && sg.inChorus(x.bar)) HPARTS.forEach(p => {
      if (opts[p] && (songCellDone(p, x.k, sid) || state.unlockedAll)) toneMR(harmEt(sg, p, x.k) * oct, tt, d, hv);
    });
    ev.push({ t: tt, fn: () => { highlight(i); concertPos = i; } }); tt += d;
  });
  visualRun(base, ev, tt + 0.4, onDone);
}
function startConcert(from) {
  if (running) { stopAll(); return; }
  if (!audio()) return;
  running = 'concert'; render();
  playSong(state.song, { ...state.sel, up: false, down: state.sel.down !== false, bells: true, oct: octOf(), slow: state.speed === 'slow', drums: true, count: true }, from, () => {
    concertPos = 0; running = null; stopAll(); render(); celebrate(); toast('연주 끝! 관객들이 박수를 쳐요 👏');
  });
}
function playProgression() {
  stopAll();
  ['do', 'fa', 'sol', 'do'].forEach((r, i) => { const f = NOTES[r].et; [1, 1.25, 1.5].forEach(m => tone(f * m, i * 1.1, 1.2, 0.5)); });
}

/* ============================================================
   [16] 그리기 + 버튼 연결
   ============================================================ */
function render() {
  renderNav();
  let html;
  if (state.view === 'songs') html = renderSongs();
  else if (state.view !== 'act' || !state.act || (state.act === 'song' && !SONGS[state.song])) { state.view = 'home'; html = renderHome(); }
  else if (state.act === 'lab') html = curStep() === 2 && stepOpen(2) ? renderLab2() : renderLab1();
  else if (state.act === 'chords') html = curStep() === 2 && stepOpen(2) ? renderChords2() : renderChords1();
  else html = curStep() === 2 && stepOpen(2) ? renderConcert() : renderSong1();
  document.getElementById('screen').innerHTML = html;
}
const screen = document.getElementById('screen');
screen.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.f) return;
  if (el.dataset.digits) { const v = el.value.replace(/\D/g, ''); if (v !== el.value) el.value = v; }
  const c = cellOf(el.dataset.s, el.dataset.id); c[el.dataset.f] = el.value; save();
});
screen.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.dataset || !e.target.dataset.f) return;
  e.preventDefault(); const box = e.target.closest('[id^="cell-"]'); const b = box && box.querySelector('[data-primary]'); if (b) b.click();
});
screen.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (['est', 'expr', 'calc', 'nat', 'gap', 'point', 'friend', 'pick', 'pair'].includes(a)) { cellAction(a, el.dataset.s, el.dataset.id, v); return; }
  switch (a) {
    case 'open': openAct(v); break;
    case 'home': stopAll(); state.view = 'home'; state.act = null; save(); render(); window.scrollTo({ top: 0 }); break;
    case 'songs': openAct('songs'); break;
    case 'song': openSong(v); break;
    case 'step': go(+v, el); break;
    case 'hear': tone(NOTES[v].et, 0, 1.2); break;
    case 'lplay': { const m = +v; tone(NOTES.do.et, 0, 1.8, 0.7); tone(NOTES.do.et * LAB_SOUND(m), 0, 1.8, 0.7); if (!state.lab.listened[m]) { state.lab.listened[m] = true; save(); render(); } break; }
    case 'ljudge': { const [m, j] = v.split(':'); state.lab.judge[m] = j; save(); render(); break; }
    case 'lreveal': state.lab.reveal = true; save(); render(); break;
    case 'finishlab':
      state.done.lab = true; celebrate(); toast('활동 1 완료! 우리 모둠 노래를 눌러요 🎶'); openAct('songs'); break;
    case 'chord': playChord(v, false); break;
    case 'arp': playChord(v, true); break;
    case 'progression': playProgression(); break;
    case 'finishchords': state.done.chords = true; celebrate(); toast('활동 2 완료! 우리 반 연주회 노래를 골라요 🎶'); openAct('songs'); break;
    case 'assign': {
      const m = SS().assign, on = !!m[v];
      if (!on && assignCount() >= ASSIGN_MAX_OF()) { toast(`한 사람이 ${ASSIGN_TXT()}칸씩 맡아요. (최대 ${ASSIGN_MAX_OF()}칸까지 고를 수 있어요)`); return; }
      if (on) delete m[v]; else m[v] = true; save(); render(); break;
    }
    case 'note': { const [view, k] = v.split(':'); if (view === 'melody') tone(NOTES[k].et, 0, 1.0); else if (songCellDone(view, k) || state.unlockedAll) tone(hFreq(view, k), 0, 1.0); else toast('아직 계산하지 않은 화음이에요.'); break; }
    case 'sel': state.sel[v] = !state.sel[v]; save(); if (running) { const pos = concertPos; stopAll(); startConcert(pos); } else render(); break;
    case 'speed': state.speed = v; save(); if (running) { const pos = concertPos; stopAll(); startConcert(pos); } else render(); break;
    case 'pview': state.pview = v; save(); render(); break;
    case 'oct': state.oct = +v; save(); if (running) { const pos = concertPos; stopAll(); startConcert(pos); } else { render(); tone(NOTES.do.et * Math.pow(2, +v), 0, 1.2); } break;
    case 'octdo': tone(NOTES.do.et * Math.pow(2, octOf()), 0, 1.2); break;
    case 'cplay': startConcert(v === 'resume' ? concertPos : 0); break;
    case 'cpause': stopAll(); break;
  }
});
document.getElementById('stepNav').addEventListener('click', e => { const el = e.target.closest('[data-a="step"]'); if (el) go(+el.dataset.v, el); });
document.getElementById('homeBtn').addEventListener('click', () => { stopAll(); state.view = 'home'; state.act = null; save(); render(); window.scrollTo({ top: 0 }); });

/* [17] 선생님 도구 (#teacher) */
if (teacherMode) {
  document.getElementById('teacherTools').classList.remove('hidden');
  const fillCell = (scope, spec) => { const c = cellOf(scope, spec.id); if (c.done) return; Object.assign(c, { stage: 'end', done: true, answer: fmt(product(spec)), a: String(spec.a), b: String(spec.m), x: String(spec.a), y: natOf(spec.m), prod: spec.a * +natOf(spec.m), point: String(spec.a * +natOf(spec.m)).length - decimals(spec.m), pick: answerKey(spec), msg: '', firstTry: c.firstTry === null ? true : c.firstTry }); };
  document.getElementById('tFill').addEventListener('click', () => {
    if (state.view !== 'act') { toast('활동을 연 상태에서 눌러 주세요.'); return; }
    if (state.act === 'lab') { LAB_MULTS.forEach(m => { fillCell('lab', labSpec(m)); state.lab.listened[m] = true; state.lab.judge[m] = state.lab.judge[m] || LAB_ANSWER[m]; }); }
    else if (state.act === 'chords') CHORD_ROOTS.forEach(r => CHORD_MULTS.forEach(m => fillCell('chords', chordSpec(r, m))));
    else { if (assignCount() < ASSIGN_MIN) songItems().slice(0, ASSIGN_SHOW).forEach(([p, k]) => { SS().assign[p + ':' + k] = true; }); songItems().forEach(([p, k]) => fillCell('song', songSpec(p, k))); }
    save(); render(); toast('정답을 채웠어요.');
  });
  document.getElementById('tUnlock').addEventListener('click', () => { state.unlockedAll = !state.unlockedAll; save(); render(); toast(state.unlockedAll ? '모든 활동·단계를 열었어요.' : '단계 잠금을 다시 켰어요.'); });
  const tr = document.getElementById('tReset'); let armed = false;
  tr.addEventListener('click', () => {
    if (!armed) { armed = true; tr.textContent = '한 번 더 누르면 모두 지워요'; setTimeout(() => { armed = false; tr.textContent = '선생님: 모두 처음으로'; }, 3000); return; }
    armed = false; tr.textContent = '선생님: 모두 처음으로'; stopAll(); state = freshState(); save(); render(); toast('처음 상태로 돌렸어요.');
  });
}

render();
})();
</script>
